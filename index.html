<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overland">
<meta name="theme-color" content="#0a0e1a">
<link rel="apple-touch-icon" href="icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com data:; connect-src https://api.anthropic.com https://api.elevenlabs.io https://elevenlabs.io; media-src blob: data:;">
<title>Overland</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root {
    --night: #070b16;
    --deep: #0d1526;
    --glass: #111d35;
    --rim: #1a2d50;
    --gold: #c9a84c;
    --gold-dim: #7a6230;
    --gold-bright: #e8c97a;
    --ice: #a8c4d4;
    --ice-dim: #4a6a7a;
    --text: #c8d8e8;
    --text-dim: #5a7090;
    --text-muted: #2a3a50;
    --danger: #c04040;
    --success: #4a9060;
    --radius: 2px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--night);
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
    position: fixed;
    width: 100%;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(200,220,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 42% 8%, rgba(200,220,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 68% 15%, rgba(200,220,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 5%, rgba(200,220,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 28% 35%, rgba(200,220,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 91% 28%, rgba(200,220,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 42%, rgba(200,220,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 7% 55%, rgba(200,220,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 77% 48%, rgba(200,220,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 33% 62%, rgba(200,220,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 62% 70%, rgba(200,220,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 20% 78%, rgba(200,220,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 72%, rgba(200,220,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 48% 85%, rgba(200,220,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 3% 90%, rgba(200,220,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 92%, rgba(200,220,255,0.5) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* Atmospheric glow at horizon */
  body::after {
    content: '';
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 35%;
    background: linear-gradient(to top, rgba(10,20,45,0.8) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ── HEADER ── */
  .header {
    padding: 52px 28px 20px;
    text-align: center;
    flex-shrink: 0;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 42px;
    font-weight: 300;
    letter-spacing: 0.18em;
    color: var(--gold);
    text-transform: uppercase;
    line-height: 1;
    text-shadow: 0 0 40px rgba(201,168,76,0.3);
  }

  .tagline {
    font-family: 'Inconsolata', monospace;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* ── SCREENS ── */
  .screen {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow-y: auto;
    padding: 0 24px 40px;
    -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: flex; }

  /* ── SETUP SCREEN ── */
  .section-label {
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.35em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
    margin-top: 28px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 4px;
  }

  .field {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--rim);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-family: 'Inconsolata', monospace;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    -webkit-appearance: none;
    text-transform: uppercase;
  }

  .field::placeholder {
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .field:focus {
    border-color: var(--gold-dim);
    background: rgba(201,168,76,0.04);
  }

  .field.flight-num {
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  /* Seat selector */
  .seat-toggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--rim);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .seat-btn {
    flex: 1;
    padding: 0;
    height: 52px;
    background: transparent;
    border: none;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 17px;
    font-weight: 300;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .seat-btn::after {
    content: '';
    position: absolute;
    right: 0;
    top: 20%;
    bottom: 20%;
    width: 1px;
    background: var(--rim);
  }
  .seat-btn:last-child::after { display: none; }

  .seat-btn.active {
    background: rgba(201,168,76,0.12);
    color: var(--gold);
  }

  /* API key fields */
  .key-field {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--rim);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-family: 'Inconsolata', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--ice-dim);
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .key-field:focus {
    border-color: var(--ice-dim);
    color: var(--ice);
  }

  /* Divider */
  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--rim), transparent);
    margin: 28px 0 0;
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: var(--radius);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s;
    margin-top: 12px;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.08));
    border: 1px solid var(--gold-dim);
    color: var(--gold);
  }

  .btn-primary:active { background: rgba(201,168,76,0.25); }

  .btn-primary:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .btn-ice {
    background: linear-gradient(135deg, rgba(168,196,212,0.12), rgba(168,196,212,0.05));
    border: 1px solid var(--ice-dim);
    color: var(--ice);
  }

  .btn-ice:active { background: rgba(168,196,212,0.2); }
  .btn-ice:disabled { opacity: 0.3; cursor: default; }

  .btn-danger {
    background: transparent;
    border: 1px solid rgba(192,64,64,0.4);
    color: var(--danger);
    font-size: 13px;
    padding: 12px;
    margin-top: 8px;
  }

  /* Status message */
  .status {
    font-family: 'Inconsolata', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-align: center;
    margin-top: 14px;
    min-height: 16px;
    line-height: 1.6;
  }

  .status.loading { color: var(--gold-dim); }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--success); }

  /* Waypoint preview list */
  .waypoint-list {
    margin-top: 20px;
  }

  .waypoint-item {
    border-left: 2px solid var(--rim);
    padding: 10px 14px;
    margin-bottom: 8px;
    transition: border-color 0.3s;
  }

  .waypoint-item.loaded { border-color: var(--gold-dim); }
  .waypoint-item.active-wp { border-color: var(--gold); }

  .wp-name {
    font-family: 'Inconsolata', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .wp-status {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    font-style: italic;
  }
  .wp-status.ready { color: var(--gold-dim); }

  /* ── FLIGHT SCREEN ── */
  .flight-header {
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--rim);
    flex-shrink: 0;
  }

  .route-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: 'Inconsolata', monospace;
    font-size: 22px;
    letter-spacing: 0.15em;
    color: var(--text);
  }

  .route-arrow {
    font-size: 14px;
    color: var(--gold-dim);
  }

  .flight-meta {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 8px;
  }

  .meta-item {
    font-family: 'Inconsolata', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .meta-item span {
    color: var(--ice-dim);
  }

  /* Progress track */
  .progress-section {
    padding: 24px 0 20px;
    flex-shrink: 0;
  }

  .progress-track {
    position: relative;
    height: 2px;
    background: var(--rim);
    border-radius: 1px;
    margin: 0 8px;
  }

  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: linear-gradient(to right, var(--gold-dim), var(--gold));
    border-radius: 1px;
    transition: width 10s linear;
    width: 0%;
  }

  .progress-dot {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px rgba(201,168,76,0.6);
    transition: left 10s linear;
    left: 0%;
  }

  .waypoint-markers {
    position: relative;
    height: 20px;
    margin: 4px 8px 0;
  }

  .wp-marker {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    width: 1px;
    height: 6px;
    background: var(--rim);
    transition: background 0.5s;
  }

  .wp-marker.reached { background: var(--gold-dim); }

  /* Current narration display */
  .narration-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 20px 0;
  }

  .narration-location {
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .narration-text {
    font-size: 19px;
    font-weight: 300;
    line-height: 1.75;
    color: var(--text);
    font-style: italic;
    transition: opacity 0.8s;
  }

  .narration-text.fading { opacity: 0; }

  /* Speaking indicator */
  .speaking-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    opacity: 0;
    transition: opacity 0.5s;
  }

  .speaking-indicator.active { opacity: 1; }

  .speak-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 16px;
  }

  .speak-bar {
    width: 2px;
    background: var(--gold);
    border-radius: 1px;
    animation: soundbar 0.8s ease-in-out infinite alternate;
  }
  .speak-bar:nth-child(1) { height: 4px; animation-delay: 0s; }
  .speak-bar:nth-child(2) { height: 10px; animation-delay: 0.15s; }
  .speak-bar:nth-child(3) { height: 16px; animation-delay: 0.3s; }
  .speak-bar:nth-child(4) { height: 8px; animation-delay: 0.45s; }
  .speak-bar:nth-child(5) { height: 6px; animation-delay: 0.6s; }

  @keyframes soundbar {
    from { transform: scaleY(0.3); opacity: 0.5; }
    to { transform: scaleY(1); opacity: 1; }
  }

  .speak-label {
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--gold-dim);
    text-transform: uppercase;
  }

  /* GPS status */
  .gps-status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
  }

  .gps-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.5s;
  }

  .gps-dot.locked { background: var(--success); box-shadow: 0 0 4px rgba(74,144,96,0.6); }
  .gps-dot.dead-reckoning { background: var(--gold-dim); }

  .gps-label {
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* Flight controls */
  .flight-controls {
    padding: 16px 0 32px;
    flex-shrink: 0;
  }

  .wheels-up-btn {
    width: 100%;
    padding: 20px;
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    background: linear-gradient(135deg, rgba(201,168,76,0.18), rgba(201,168,76,0.06));
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 0 20px rgba(201,168,76,0.1);
  }

  .wheels-up-btn:active {
    background: rgba(201,168,76,0.28);
    box-shadow: 0 0 30px rgba(201,168,76,0.2);
  }

  .wheels-up-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .elapsed-display {
    text-align: center;
    font-family: 'Inconsolata', monospace;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-top: 16px;
  }

  .elapsed-display.airborne { color: var(--text); }

  .btn-test {
    background: transparent;
    border: 1px solid var(--ice-dim);
    color: var(--ice-dim);
    font-size: 13px;
    padding: 12px;
    margin-top: 0;
    letter-spacing: 0.2em;
  }

  .btn-test:active { background: rgba(168,196,212,0.08); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rim); }

  /* Utility */
  .mt8 { margin-top: 8px; }
  .mt16 { margin-top: 16px; }

  /* Loading shimmer */
  @keyframes shimmer {
    0% { opacity: 0.4; }
    50% { opacity: 0.8; }
    100% { opacity: 0.4; }
  }

  .loading-pulse {
    animation: shimmer 1.5s ease-in-out infinite;
  }

  /* Fade in on load */
  .app { animation: fadein 1.2s ease both; }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="wordmark">Overland</div>
    <div class="tagline">A reading of the earth below</div>
  </div>

  <!-- ══════════════ SETUP SCREEN ══════════════ -->
  <div class="screen active" id="screen-setup">

    <div class="section-label">Route</div>
    <div class="input-row">
      <input class="field" id="origin" placeholder="SLC" maxlength="4" autocomplete="off" autocorrect="off" spellcheck="false">
      <input class="field" id="dest" placeholder="MSO" maxlength="4" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>

    <div class="section-label">Your window</div>
    <div class="seat-toggle">
      <button class="seat-btn active" id="btn-left" onclick="setSeat('left')">Left window</button>
      <button class="seat-btn" id="btn-right" onclick="setSeat('right')">Right window</button>
    </div>

    <div class="divider"></div>

    <div id="keys-section">
      <div class="section-label" id="keys-hint">API Keys — saved on this device after first entry</div>
      <input class="key-field" id="anthropic-key" type="password" placeholder="Anthropic key  sk-ant-..." autocomplete="off" autocorrect="off" spellcheck="false" style="margin-bottom:8px">
      <input class="key-field" id="elevenlabs-key" type="password" placeholder="ElevenLabs API key" autocomplete="off" autocorrect="off" spellcheck="false" style="margin-top:0;margin-bottom:8px">
      <input class="key-field" id="voice-id" placeholder="ElevenLabs voice ID" autocomplete="off" autocorrect="off" spellcheck="false">
      <div style="text-align:right;margin-top:6px">
        <span onclick="clearKeys()" style="font-family:monospace;font-size:10px;letter-spacing:0.15em;color:var(--text-muted);cursor:pointer;text-transform:uppercase;">Clear saved keys</span>
      </div>
    </div>

    <button class="btn btn-primary" id="btn-depart" onclick="departAction()" style="margin-top:24px">
      Prepare for Departure
    </button>

    <div class="status" id="load-status"></div>

    <div class="waypoint-list" id="waypoint-list"></div>

    <button class="btn btn-test" id="btn-test" onclick="testNarrations()" style="display:none;margin-top:8px">
      ▷ Test All Narrations
    </button>

  </div>

  <!-- ══════════════ FLIGHT SCREEN ══════════════ -->
  <div class="screen" id="screen-flight">

    <div class="flight-header">
      <div class="route-display">
        <span id="fl-origin">—</span>
        <span class="route-arrow">——›</span>
        <span id="fl-dest">—</span>
      </div>
      <div class="flight-meta">
        <div class="meta-item">Flight <span id="fl-num">—</span></div>
        <div class="meta-item">Seat <span id="fl-seat">—</span></div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-dot" id="progress-dot"></div>
        <div class="waypoint-markers" id="wp-markers" style="position:absolute;top:8px;left:0;right:0;"></div>
      </div>
    </div>

    <div class="narration-card">
      <div class="narration-location" id="narration-location">Standing by</div>
      <div class="narration-text" id="narration-text">The narratives are loaded. When you're wheels up, press the button below. Overland will find you from there.</div>
      <div class="speaking-indicator" id="speaking-indicator">
        <div class="speak-bars">
          <div class="speak-bar"></div>
          <div class="speak-bar"></div>
          <div class="speak-bar"></div>
          <div class="speak-bar"></div>
          <div class="speak-bar"></div>
        </div>
        <span class="speak-label">Narrating</span>
      </div>
      <div class="gps-status" style="margin-top:20px">
        <div class="gps-dot" id="gps-dot"></div>
        <span class="gps-label" id="gps-label">GPS searching</span>
      </div>
    </div>

    <div class="flight-controls">
      <button class="wheels-up-btn" id="btn-wheels-up" onclick="wheelsUp()">
        Wheels Up
      </button>
      <div class="elapsed-display" id="elapsed-display">0:00:00</div>
      <button class="btn btn-danger" onclick="endFlight()">End Flight / Back to Setup</button>
    </div>

  </div>
</div>


<script>
// ═══════════════════════════════════════════════
// LOCAL STORAGE — keys persist across sessions
// ═══════════════════════════════════════════════
function saveKeys() {
  try {
    const ak = document.getElementById('anthropic-key').value.trim();
    const ek = document.getElementById('elevenlabs-key').value.trim();
    const vi = document.getElementById('voice-id').value.trim();
    if (ak) localStorage.setItem('overland_ak', ak);
    if (ek) localStorage.setItem('overland_ek', ek);
    if (vi) localStorage.setItem('overland_vi', vi);
  } catch(e) {}
}

function loadKeys() {
  try {
    const ak = localStorage.getItem('overland_ak');
    const ek = localStorage.getItem('overland_ek');
    const vi = localStorage.getItem('overland_vi');
    if (ak) document.getElementById('anthropic-key').value = ak;
    if (ek) document.getElementById('elevenlabs-key').value = ek;
    if (vi) document.getElementById('voice-id').value = vi;

// ═══════════════════════════════════════════════
// GEO MATH
// ═══════════════════════════════════════════════
function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function initialBearing(lat1, lon1, lat2, lon2) {
  const dLon = toRad(lon2-lon1);
  const y = Math.sin(dLon)*Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x))+360)%360;
}

function intermediatePoint(lat1, lon1, lat2, lon2, frac) {
  const R=6371, d=haversineKm(lat1,lon1,lat2,lon2)/R;
  const a=Math.sin((1-frac)*d)/Math.sin(d), b=Math.sin(frac*d)/Math.sin(d);
  const r1=toRad(lat1),r2=toRad(lat2),n1=toRad(lon1),n2=toRad(lon2);
  const x=a*Math.cos(r1)*Math.cos(n1)+b*Math.cos(r2)*Math.cos(n2);
  const y=a*Math.cos(r1)*Math.sin(n1)+b*Math.cos(r2)*Math.sin(n2);
  const z=a*Math.sin(r1)+b*Math.sin(r2);
  return [toDeg(Math.atan2(z,Math.sqrt(x*x+y*y))),toDeg(Math.atan2(y,x))];
}

function progressAlongRoute(lat, lon, lat1, lon1, lat2, lon2) {
  const total = haversineKm(lat1,lon1,lat2,lon2);
  const fromOrigin = haversineKm(lat1,lon1,lat,lon);
  return Math.min(1, Math.max(0, fromOrigin/total));
}

function deadReckon() {
  if (!state.lastKnownLat || !state.airborne) return null;
  const elapsedHours = (Date.now()-state.lastKnownTime)/3600000;
  const distKm = state.lastKnownSpeed * elapsedHours;
  const bearing = toRad(initialBearing(
    state.lastKnownLat, state.lastKnownLon,
    state.destCoords[0], state.destCoords[1]
  ));
  const R=6371, d=distKm/R;
  const lat1=toRad(state.lastKnownLat), lon1=toRad(state.lastKnownLon);
  const lat2=Math.asin(Math.sin(lat1)*Math.cos(d)+Math.cos(lat1)*Math.sin(d)*Math.cos(bearing));
  const lon2=lon1+Math.atan2(Math.sin(bearing)*Math.sin(d)*Math.cos(lat1),Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
  return [toDeg(lat2),toDeg(lon2)];
}

// ═══════════════════════════════════════════════
// WAYPOINT GENERATION
// ═══════════════════════════════════════════════
function generateWaypoints(originCoords, destCoords, totalKm) {
  const numMid = Math.max(2, Math.min(7, Math.floor(totalKm/200)));
  const wps = [];
  wps.push({ lat:originCoords[0], lon:originCoords[1], distFrac:0.05, tier:'departure', name:'Departure' });
  for (let i=1; i<=numMid; i++) {
    const frac = i/(numMid+1);
    const [lat,lon] = intermediatePoint(originCoords[0],originCoords[1],destCoords[0],destCoords[1],frac);
    wps.push({ lat, lon, distFrac:frac, tier:'cruise', name:`Waypoint ${i}` });
  }
  wps.push({ lat:destCoords[0], lon:destCoords[1], distFrac:0.92, tier:'approach', name:'Approach' });
  return wps;
}

// ═══════════════════════════════════════════════
// SYSTEM PROMPT
// ═══════════════════════════════════════════════
const SYSTEM_PROMPT = `You write narration for a passenger in a window seat on a commercial flight. Your voice is that of the most quietly fascinating person they have ever sat next to — someone who spent decades learning the land below and cannot help noticing one extraordinary thing out the window.

Rules:
— One idea per waypoint. Develop it fully. Do not survey or list multiple facts.
— Never say "below you," "out your window," "you can see," or any variant. The passenger knows where they are.
— No pablum. No "stunning vistas" or "rich history" or "beautiful landscape." Specific nouns only — name the river, the formation, the geological epoch, the event, the species, the city.
— Start in the middle of the observation, as if you just noticed it. No throat-clearing, no introduction.
— End before you have said everything. Leave a remainder. Let silence do work.
— Your richest veins: geology, hydrology, ecology, Indigenous history (verifiable facts only — no myth, no romanticization), American history, infrastructure, and cities. A dam, a grid of lights at night, a river that used to run free — all fair game.
— Respect the passenger's intelligence. They can handle complexity. They cannot handle being talked down to.
— Write in flowing prose. No headers, no lists. Just the narration itself.`;

function tierWords(tier) {
  if (tier==='departure') return 150;
  if (tier==='approach') return 100;
  return 250;
}

// ═══════════════════════════════════════════════
// CLAUDE NARRATION
// ═══════════════════════════════════════════════
async function generateNarration(wp, origin, dest, seat, anthropicKey) {
  const bearing = initialBearing(wp.lat, wp.lon, state.destCoords[0], state.destCoords[1]);
  const compassDir = ['N','NE','E','SE','S','SW','W','NW'][Math.round(bearing/45)%8];
  const seatDesc = seat==='left' ? 'left window' : 'right window';
  const words = tierWords(wp.tier);

  const userPrompt = `Flight: ${origin} to ${dest}
Passenger position: ${seatDesc}
Current coordinates: ${wp.lat.toFixed(3)}°N, ${Math.abs(wp.lon).toFixed(3)}°W
Flight phase: ${wp.tier}
Heading: approximately ${compassDir} (${Math.round(bearing)}°)

Write ${words} words of narration for this exact location. Ground it in what is actually at these coordinates — the specific geology, hydrology, ecology, history, or human geography of this precise place. Be specific. Be surprising. Start in the middle of the observation.`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': anthropicKey,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 500,
      system: SYSTEM_PROMPT,
      messages: [{ role:'user', content:userPrompt }]
    })
  });
  if (!response.ok) throw new Error(`Claude API ${response.status}`);
  const data = await response.json();
  return data.content[0].text.trim();
}

// ═══════════════════════════════════════════════
// ELEVENLABS TTS
// ═══════════════════════════════════════════════
async function speakNarration(text, elKey, voiceId) {
  const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
    method: 'POST',
    headers: { 'xi-api-key': elKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text,
      model_id: 'eleven_monolingual_v1',
      voice_settings: { stability:0.55, similarity_boost:0.82, style:0.12 }
    })
  });
  if (!response.ok) throw new Error(`ElevenLabs ${response.status}`);
  const blob = await response.blob();
  return URL.createObjectURL(blob);
}

function setStatus(msg, type='') {

function updateWpItem(index, status, ready=false) {
  const item = document.querySelector(`[data-wp="${index}"]`);

  statusEl.textContent = status;
  statusEl.className = 'wp-status' + (ready ? ' ready' : '');

}

function formatTime(ms) {
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════════
// LOAD NARRATIONS
// ═══════════════════════════════════════════════
async function loadNarrations() {
  const origin = document.getElementById('origin').value.trim().toUpperCase();
  const dest = document.getElementById('dest').value.trim().toUpperCase();
  const anthropicKey = document.getElementById('anthropic-key').value.trim();
  const elKey = document.getElementById('elevenlabs-key').value.trim();
  const voiceId = document.getElementById('voice-id').value.trim();

  if (!origin || !dest) { setStatus('Enter origin and destination airports.', 'error'); return; }
  if (!anthropicKey) { setStatus('Anthropic API key required.', 'error'); return; }
  if (!elKey || !voiceId) { setStatus('ElevenLabs key and Voice ID required.', 'error'); return; }

  const originCoords = AIRPORTS[origin];
  const destCoords = AIRPORTS[dest];
  if (!originCoords) { setStatus(`Airport not found: ${origin}`, 'error'); return; }
  if (!destCoords) { setStatus(`Airport not found: ${dest}`, 'error'); return; }

  // Save keys to localStorage
  saveKeys();

  state.originCoords = originCoords;
  state.destCoords = destCoords;
  state.totalDistKm = haversineKm(...originCoords, ...destCoords);
  state.flightOrigin = origin;
  state.flightDest = dest;
  state.flightNum = '—';
  state.elKey = elKey;
  state.voiceId = voiceId;

  setBtnPhase('loading');
  setStatus(`Charting ${origin} → ${dest} · ${Math.round(state.totalDistKm)} km`, 'loading');

  const wps = generateWaypoints(originCoords, destCoords, state.totalDistKm);
  state.waypoints = wps;

  // Render waypoint list
  const listEl = document.getElementById('waypoint-list');
  listEl.innerHTML = '';
  wps.forEach((wp, i) => {
    listEl.innerHTML += `
      <div class="waypoint-item" data-wp="${i}">
        <div class="wp-name">${wp.tier==='departure'?'Departure':wp.tier==='approach'?'Approach':`En route ${i}`} · ${wp.lat.toFixed(1)}°N ${Math.abs(wp.lon).toFixed(1)}°W</div>
        <div class="wp-status">Writing…</div>
      </div>`;
  });

  let allOk = true;
  for (let i=0; i<wps.length; i++) {
    const wp = wps[i];
    setStatus(`Writing narrative ${i+1} of ${wps.length}…`, 'loading');
    try {
      wp.text = await generateNarration(wp, origin, dest, state.seat, anthropicKey);
      updateWpItem(i, 'Narrative ready — rendering audio…');
      wp.audioUrl = await speakNarration(wp.text, elKey, voiceId);
      updateWpItem(i, '✓ Ready', true);
    } catch(e) {
      updateWpItem(i, `Error: ${e.message}`);
      allOk = false;
    }
  }

  if (allOk) {
    setStatus(`${wps.length} narratives loaded. Ready for departure.`, 'ok');
  } else {
    setStatus('Some narratives failed. You can still fly with what loaded.', 'error');
  }

  // Show test button and preview panel
  document.getElementById('btn-test').style.display = 'block';
  let preview = document.getElementById('test-preview');
  if (!preview) {
    preview = document.createElement('div');
    preview.id = 'test-preview';
    preview.style.cssText = 'display:none;margin-top:16px;padding:16px;border-left:2px solid var(--gold-dim);';
    preview.innerHTML = '<div class="test-loc" style="font-family:Inconsolata,monospace;font-size:9px;letter-spacing:0.3em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:8px"></div><div class="test-text" style="font-size:16px;font-weight:300;font-style:italic;line-height:1.7;color:var(--text)"></div>';
    document.getElementById('waypoint-list').after(preview);
  }

  setBtnPhase('boarding');
}

// ═══════════════════════════════════════════════
// GO TO FLIGHT SCREEN
// ═══════════════════════════════════════════════
function goToFlight() {
  document.getElementById('screen-setup').classList.remove('active');
  document.getElementById('screen-flight').classList.add('active');

  document.getElementById('fl-origin').textContent = state.flightOrigin;
  document.getElementById('fl-dest').textContent = state.flightDest;
  document.getElementById('fl-num').textContent = state.flightNum;
  document.getElementById('fl-seat').textContent = state.seat==='left' ? 'Left window' : 'Right window';

  const markersEl = document.getElementById('wp-markers');
  markersEl.innerHTML = '';
  state.waypoints.forEach((wp, i) => {
    const marker = document.createElement('div');
    marker.className = 'wp-marker';
    marker.style.left = (wp.distFrac*100)+'%';
    marker.dataset.wpIdx = i;
    markersEl.appendChild(marker);
  });

  startGPS();
}

// ═══════════════════════════════════════════════
// GPS
// ═══════════════════════════════════════════════
function startGPS() {
  if (!navigator.geolocation) { updateGPSStatus('none'); return; }
  state.gpsWatcher = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude, speed } = pos.coords;
      state.lastKnownLat = latitude;
      state.lastKnownLon = longitude;
      state.lastKnownTime = Date.now();
      if (speed) state.lastKnownSpeed = speed * 3.6;
      updateGPSStatus('locked');
      if (!state.airborne && speed && speed*3.6 > 150) autoWheelsUp(latitude, longitude);
      if (state.airborne) updateFlightProgress(latitude, longitude);
    },
    () => { updateGPSStatus('searching'); },
    { enableHighAccuracy:true, maximumAge:10000, timeout:15000 }
  );
}

function autoWheelsUp(lat, lon) {
  state.airborne = true;
  state.takeoffTime = Date.now();
  state.takeoffLat = lat;
  state.takeoffLon = lon;
  document.getElementById('btn-wheels-up').disabled = true;
  document.getElementById('btn-wheels-up').textContent = 'Airborne';
  document.getElementById('elapsed-display').classList.add('airborne');
  startFlightTimer();
  scheduleNarrations();
}

function updateGPSStatus(status) {
  const dot = document.getElementById('gps-dot');
  const label = document.getElementById('gps-label');
  dot.className = 'gps-dot';
  if (status==='locked') { dot.classList.add('locked'); label.textContent='GPS locked'; }
  else if (status==='dead-reckoning') { dot.classList.add('dead-reckoning'); label.textContent='Dead reckoning'; }
  else { label.textContent='GPS searching'; }
}

// ═══════════════════════════════════════════════
// MANUAL WHEELS UP (flight screen)
// ═══════════════════════════════════════════════
function wheelsUp() {
  if (state.airborne) return;
  state.airborne = true;
  state.takeoffTime = Date.now();
  state.takeoffLat = state.lastKnownLat || state.originCoords[0];
  state.takeoffLon = state.lastKnownLon || state.originCoords[1];
  document.getElementById('btn-wheels-up').disabled = true;
  document.getElementById('btn-wheels-up').textContent = 'Airborne';
  document.getElementById('elapsed-display').classList.add('airborne');
  startFlightTimer();
  scheduleNarrations();
}

// ═══════════════════════════════════════════════
// FLIGHT TIMER & PROGRESS
// ═══════════════════════════════════════════════
function startFlightTimer() {
  state.flightTimer = setInterval(() => {
    if (!state.airborne) return;
    document.getElementById('elapsed-display').textContent = formatTime(Date.now()-state.takeoffTime);
    if (state.lastKnownTime && (Date.now()-state.lastKnownTime) > 30000) {
      updateGPSStatus('dead-reckoning');
      const pos = deadReckon();
      if (pos) updateFlightProgress(pos[0], pos[1]);
    }
  }, 1000);
}

function updateFlightProgress(lat, lon) {
  if (!state.originCoords || !state.destCoords) return;
  const frac = progressAlongRoute(lat, lon,
    state.originCoords[0], state.originCoords[1],
    state.destCoords[0], state.destCoords[1]);
  const pct = (frac*100).toFixed(1);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-dot').style.left = pct+'%';
}

// ═══════════════════════════════════════════════
// NARRATION SCHEDULING
// ═══════════════════════════════════════════════
function scheduleNarrations() {
  const flightDurationMs = (state.totalDistKm / 800) * 3600000;
  state.waypoints.forEach((wp, i) => {
    if (!wp.audioUrl) return;
    const delay = wp.distFrac * flightDurationMs;
    setTimeout(() => { playNarration(i); }, delay);
  });
}

function playNarration(index) {
  const wp = state.waypoints[index];
  if (!wp || !wp.audioUrl || !state.airborne) return;
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
  state.currentWpIndex = index;

  const textEl = document.getElementById('narration-text');
  const locEl = document.getElementById('narration-location');
  textEl.classList.add('fading');
  setTimeout(() => {
    locEl.textContent = `${wp.tier.toUpperCase()} · ${wp.lat.toFixed(1)}°N ${Math.abs(wp.lon).toFixed(1)}°W`;
    textEl.textContent = wp.text;
    textEl.classList.remove('fading');
  }, 800);

  document.querySelectorAll('.wp-marker').forEach((m, i) => {
    if (i <= index) m.classList.add('reached');
  });

  const audio = new Audio(wp.audioUrl);
  state.currentAudio = audio;
  document.getElementById('speaking-indicator').classList.add('active');
  state.speaking = true;
  audio.play();
  audio.onended = () => {
    document.getElementById('speaking-indicator').classList.remove('active');
    state.speaking = false;
    state.currentAudio = null;
  };
}

// ═══════════════════════════════════════════════
// END FLIGHT
// ═══════════════════════════════════════════════
function endFlight() {
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
  if (state.flightTimer) { clearInterval(state.flightTimer); state.flightTimer = null; }
  if (state.gpsWatcher) { navigator.geolocation.clearWatch(state.gpsWatcher); state.gpsWatcher = null; }

  state.airborne = false;
  state.takeoffTime = null;
  state.currentWpIndex = -1;
  state.speaking = false;

  document.getElementById('btn-wheels-up').disabled = false;
  document.getElementById('btn-wheels-up').textContent = 'Wheels Up';
  document.getElementById('elapsed-display').classList.remove('airborne');
  document.getElementById('elapsed-display').textContent = '0:00:00';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-dot').style.left = '0%';
  document.getElementById('speaking-indicator').classList.remove('active');
  document.getElementById('narration-text').textContent = "The narratives are loaded. When you're wheels up, press the button below. Overland will find you from there.";
  document.getElementById('narration-location').textContent = 'Standing by';

  // Reset button for next flight
  setBtnPhase('ready');
  setStatus('', '');
  document.getElementById('waypoint-list').innerHTML = '';

  document.getElementById('screen-flight').classList.remove('active');
  document.getElementById('screen-setup').classList.add('active');
}

// ═══════════════════════════════════════════════
// TEST MODE — play all narrations quickly on ground
// ═══════════════════════════════════════════════
async function testNarrations() {
  const btn = document.getElementById('btn-test');
  btn.disabled = true;
  btn.textContent = '▷ Playing…';

  for (let i = 0; i < state.waypoints.length; i++) {
    const wp = state.waypoints[i];
    if (!wp.audioUrl) continue;

    // Show text
    const textEl = document.getElementById('narration-text');
    const locEl = document.getElementById('narration-location');

    // Temporarily show narration on setup screen
    const preview = document.getElementById('test-preview');
    if (preview) {
      preview.style.display = 'block';
      preview.querySelector('.test-loc').textContent =
        `${wp.tier.toUpperCase()} · ${wp.lat.toFixed(1)}°N ${Math.abs(wp.lon).toFixed(1)}°W`;
      preview.querySelector('.test-text').textContent = wp.text;
    }

    // Play audio and wait for it to finish
    await new Promise(resolve => {
      if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
      const audio = new Audio(wp.audioUrl);
      state.currentAudio = audio;
      audio.play();
      audio.onended = resolve;
      audio.onerror = resolve;
    });

    // Brief pause between narrations
    await new Promise(r => setTimeout(r, 1500));
  }

  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
  btn.disabled = false;
  btn.textContent = '▷ Test All Narrations';
}

// ═══════════════════════════════════════════════

['origin','dest'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('input', () => { el.value = el.value.toUpperCase(); });
});

// Load saved keys on startup
loadKeys();
